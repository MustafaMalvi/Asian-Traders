name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Locate project and add google-services.json
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          S=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$S" ]; then
            Z=$(find . -iname '*.zip' -not -path './.git/*' | head -n1)
            if [ -n "$Z" ]; then
              echo "Unzipping $Z"
              mkdir -p _unz && unzip -q "$Z" -d _unz
              S=$(find _unz -name settings.gradle.kts | head -n1)
            fi
          fi
          if [ -z "$S" ]; then
            echo "Files in repo:"; find . -not -path './.git/*' -maxdepth 3 | head -50
            echo "::error::Project not found. Upload AsianTradersShop-full.zip to the repo root."
            exit 1
          fi
          DIR=$(dirname "$S")
          echo "Project folder: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          mkdir -p "$DIR/app"
          if [ -n "$GSJ" ]; then printf '%s' "$GSJ" > "$DIR/app/google-services.json"; fi
          if [ ! -f "$DIR/app/google-services.json" ]; then
            echo "::error::google-services.json missing. Add repo secret GOOGLE_SERVICES_JSON (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as release (direct download link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            --title "Latest build" --notes "Debug APK"
